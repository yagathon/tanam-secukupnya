[project]
name = "tanam-secukupnya"
version = "0.1.0"
description = "Plant just enough: demand-driven sowing planner for small farmers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.30.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
